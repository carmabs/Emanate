// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.kotlin.jvm) apply false
    alias(libs.plugins.kotlin.multiplatform) apply false
    alias(libs.plugins.kotlin.compose) apply false
    alias(libs.plugins.kotlin.serialization) apply false
    alias(libs.plugins.kover)
    alias(libs.plugins.spotless)
}

apply from: 'build-system/config.gradle'

// Coverage report of the published modules: ./gradlew koverHtmlReport (build/reports/kover/html)
dependencies {
    kover project(':emanate-core')
    kover project(':emanate-android')
    kover project(':emanate-android-view')
    kover project(':emanate-android-compose')
    kover project(':emanate-android-compose-nav2')
    kover project(':emanate-test')
    kover project(':emanate-serialization')
}

kover {
    reports {
        filters {
            excludes {
                // Generated code
                classes('*.databinding.*', '*.BuildConfig')
            }
        }
    }
}

// Code format of the library: ./gradlew spotlessApply (the rules are in .editorconfig)
spotless {
    kotlin {
        target 'emanate-*/src/**/*.kt'
        ktlint(libs.versions.ktlint.get())
    }
    format 'misc', {
        target '*.gradle', 'emanate-*/*.gradle', 'build-system/*.gradle', 'gradle/*.toml', '*.md', '.editorconfig', '.gitignore'
        trimTrailingWhitespace()
        leadingTabsToSpaces()
        endWithNewline()
    }
}
