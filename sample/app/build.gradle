plugins {
    alias(libs.plugins.android.application)
}
android {
    compileSdk = rootProject.emanateVersioning.compileSdk

    defaultConfig {
        applicationId = "com.carmabs.emanate"
        minSdk = rootProject.emanateVersioning.minSdk
        targetSdk = rootProject.emanateVersioning.targetSdk
        versionCode = rootProject.emanateVersioning.versionCode
        versionName = rootProject.emanateVersioning.versionName
        testInstrumentationRunner = "android.support.test.runner.AndroidJUnitRunner"
    }

    // Each environment binds its own implementations of the repositories: see the environmentModule of each flavor
    flavorDimensions = ["environment"]
    productFlavors {
        mock {
            dimension = "environment"
            applicationIdSuffix = ".mock"
        }
        dev {
            dimension = "environment"
            applicationIdSuffix = ".dev"
        }
        pro {
            dimension = "environment"
        }
    }

    // The implementations that only an environment uses are in its source set, so the other builds don't have them.
    // mock and dev share the mock login
    sourceSets {
        mock.kotlin.srcDir 'src/mockDev/java'
        dev.kotlin.srcDir 'src/mockDev/java'
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    def javaVersion = rootProject.emanateVersioning.javaVersion

    compileOptions {
        sourceCompatibility = javaVersion
        targetCompatibility = javaVersion
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(rootProject.emanateVersioning.kotlinJvmTarget)
        }
    }

    namespace = 'com.carmabs.emanate.sample.injection'

    buildFeatures {
        buildConfig = true
    }

}

dependencies {
    implementation project(path: ':data-android')
    implementation project(path: ':presentation')
    implementation project(path: ':ui-android')
    implementation project(path: ':utils-android')
    implementation project(path: ':domain')

    implementation project(rootProject.emanateLibraries.emanateCore)
    implementation project(rootProject.emanateLibraries.emanateAndroid)
    implementation libs.koin.android
    implementation libs.kotlinx.coroutines.android

    testImplementation libs.kotlin.test.junit
    testImplementation libs.kotlinx.coroutines.test
}
