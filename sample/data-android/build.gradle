plugins {
    alias(libs.plugins.android.library)
}

android {
    compileSdk = rootProject.emanateVersioning.compileSdk

    defaultConfig {
        minSdk = rootProject.emanateVersioning.minSdk
        targetSdk = rootProject.emanateVersioning.targetSdk

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }


    def javaVersion = rootProject.emanateVersioning.javaVersion

    compileOptions {
        sourceCompatibility = javaVersion
        targetCompatibility = javaVersion
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(rootProject.emanateVersioning.kotlinJvmTarget)
        }
    }

    namespace = 'com.carmabs.emanate.sample.data'

}

dependencies {
    implementation project(path: ':domain')
    implementation project(path: ':utils-android')
    implementation project(rootProject.emanateLibraries.emanateCore)

    //Kotlin
    implementation libs.kotlin.stdlib
    implementation libs.kotlinx.coroutines.android

    //Serialization of the map of friends
    implementation libs.kotlinx.serialization.json
}
