plugins {
    alias(libs.plugins.android.library)
}

android {
    compileSdk = rootProject.emanateVersioning.compileSdk

    defaultConfig {
        minSdk = rootProject.emanateVersioning.minSdk
        targetSdk = rootProject.emanateVersioning.targetSdk

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    def javaVersion = rootProject.emanateVersioning.javaVersion

    compileOptions {
        sourceCompatibility = javaVersion
        targetCompatibility = javaVersion
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(rootProject.emanateVersioning.kotlinJvmTarget)
        }
    }

    namespace = 'com.carmabs.emanate.sample.androidutils'

}

dependencies {
    implementation project(path: ':domain')
    implementation libs.material

    //The JSON of the preferences. api because its serializers are part of the signature of the functions
    api libs.kotlinx.serialization.json
}
