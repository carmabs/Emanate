pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
        maven { url = "https://jitpack.io" }
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url = "https://jitpack.io" }
    }
    versionCatalogs {
        libs {
            from(files("../gradle/libs.versions.toml"))
        }
    }
}
rootProject.name = "Emanate"
include ':app',
        ':ui',
        ':presentation',
        ':data',
        ':domain',
        ':android-utils'


include(':emanate-core')
project(':emanate-core').projectDir = new File("../emanate-core")

include(':emanate-android')
project(':emanate-android').projectDir = new File("../emanate-android")

include(':emanate-android-view')
project(':emanate-android-view').projectDir = new File("../emanate-android-view")

include(':emanate-android-compose')
project(':emanate-android-compose').projectDir = new File("../emanate-android-compose")

include(':emanate-android-compose-nav2')
project(':emanate-android-compose-nav2').projectDir = new File("../emanate-android-compose-nav2")

include(':emanate-test')
project(':emanate-test').projectDir = new File("../emanate-test")

include(':emanate-serialization')
project(':emanate-serialization').projectDir = new File("../emanate-serialization")
