pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
        maven { url = "https://jitpack.io" }
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url = "https://jitpack.io" }
    }
    versionCatalogs {
        libs {
            from(files("../gradle/libs.versions.toml"))
        }
    }
}
rootProject.name = "Emanate"
include ':app',
        ':ui-android',
        ':presentation',
        ':data-android',
        ':domain',
        ':utils-android'


include(':emanate-core')
project(':emanate-core').projectDir = new File("../emanate-core")

include(':emanate-android')
project(':emanate-android').projectDir = new File("../emanate-android")

include(':emanate-compose-android')
project(':emanate-compose-android').projectDir = new File("../emanate-compose-android")

include(':emanate-compose-android-nav2')
project(':emanate-compose-android-nav2').projectDir = new File("../emanate-compose-android-nav2")

include(':emanate-test')
project(':emanate-test').projectDir = new File("../emanate-test")

include(':emanate-serialization')
project(':emanate-serialization').projectDir = new File("../emanate-serialization")
