// Kotlin Multiplatform targets of the multiplatform modules of the library (emanate-core and emanate-serialization),
// applied after the Kotlin Multiplatform plugin. The paths are relative to the module, so the sample, which includes
// the modules from its own build, uses the local.properties of the library too.
//
// Targets to compile. All of them by default (needed to publish). For faster local builds set
// emanate.targets in local.properties (not versioned), or pass -Pemanate.targets, with a comma separated list of:
// all, jvm, ios. JVM is always built because the Android modules use it.
def emanateTargetGroups = ['jvm', 'ios']
def emanateLocalProperties = new Properties()
def emanateLocalPropertiesFile = file('../local.properties')
if (emanateLocalPropertiesFile.exists()) {
    emanateLocalPropertiesFile.withInputStream { emanateLocalProperties.load(it) }
}
def emanateTargetsValue = (findProperty('emanate.targets') ?: emanateLocalProperties.getProperty('emanate.targets') ?: 'all').toString()
def emanateRequestedTargets = emanateTargetsValue.split(',')*.trim().findAll { !it.isEmpty() }
if (emanateRequestedTargets.contains('all')) {
    emanateRequestedTargets = emanateTargetGroups
}
def emanateUnknownTargets = emanateRequestedTargets - emanateTargetGroups
if (!emanateUnknownTargets.isEmpty()) {
    throw new GradleException("Unknown emanate.targets: ${emanateUnknownTargets.join(', ')}. Valid values: all, ${emanateTargetGroups.join(', ')}")
}
def emanateTargets = (emanateRequestedTargets + 'jvm') as Set

// The classes of the Kotlin plugin aren't visible by name from a script applied with apply from
def emanateJvmTargetClass = kotlin.getClass().classLoader.loadClass('org.jetbrains.kotlin.gradle.dsl.JvmTarget')

kotlin {
    jvm {
        compilerOptions {
            jvmTarget = emanateJvmTargetClass.fromTarget(rootProject.emanateVersioning.kotlinJvmTarget)
        }
    }
    if ('ios' in emanateTargets) {
        iosArm64()
        iosSimulatorArm64()
    }
}
