// Library-wide configuration. Dependency and plugin versions live in gradle/libs.versions.toml
rootProject.ext {

    emanateVersioning = [
            minSdk                 : 24,
            compileSdk             : 37,
            targetSdk              : 37,
            versionCode            : 18,
            versionName            : "7.0.0-SNAPSHOT",
            groupId                : 'com.github.carmabs',
            artifactCoreId         : 'emanate-core',
            artifactAndroidId      : 'emanate-android',
            artifactComposeId      : 'emanate-compose',
            artifactComposeNav2Id  : 'emanate-compose-nav2',
            artifactAndroidViewId  : 'emanate-android-view',
            artifactTestId         : 'emanate-test',
            javaVersion            : JavaVersion.VERSION_21,
            kotlinJvmTarget        : "21",
            testRunner             : "androidx.test.runner.AndroidJUnitRunner",
            resourceExclusions     : ['META-INF/kotlinx-io.kotlin_module', 'META-INF/emanate-android_debug.kotlin_module'],
            namespaceAndroid       : 'com.carmabs.emanate.android',
            namespaceCompose       : 'com.carmabs.emanate.compose',
            namespaceComposeNav2   : 'com.carmabs.emanate.compose.nav2',
            namespaceAndroidView   : 'com.carmabs.emanate.android.view'
    ]
}
