plugins {
    alias(libs.plugins.kotlin.multiplatform)
    alias(libs.plugins.android.kotlin.multiplatform.library)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.jetbrains.compose)
    id 'maven-publish'
    alias(libs.plugins.kover)
}

group = rootProject.emanateVersioning.groupId
version = rootProject.emanateVersioning.versionName

// The targets are shared with the other multiplatform modules: see build-system/kmp-targets.gradle
apply from: file('../build-system/kmp-targets.gradle')

kotlin {
    androidLibrary {
        namespace = rootProject.emanateVersioning.namespaceComposeNav2
        compileSdk = rootProject.emanateVersioning.compileSdk
        minSdk = rootProject.emanateVersioning.minSdk

        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(rootProject.emanateVersioning.kotlinJvmTarget)
        }
    }

    sourceSets {
        commonMain {
            dependencies {
                // Not exposed to the consumers: they already depend on it to write their screens
                implementation project(':emanate-compose')

                // The navigation module is the only one that depends on Navigation Compose: who uses another
                // navigation does not get it
                api libs.jetbrains.navigation.compose
            }
        }
        commonTest {
            dependencies {
                implementation libs.kotlin.test
                implementation libs.compose.multiplatform.test
                // Sends the back event to the screens
                implementation libs.jetbrains.navigationevent.compose
            }
        }
        jvmTest {
            dependencies {
                // The Compose runtime of the desktop, needed to run the UI tests on the JVM
                implementation compose.desktop.currentOs
                // The main dispatcher of the JVM
                implementation libs.kotlinx.coroutines.swing
            }
        }
    }
}
