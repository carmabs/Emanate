plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.compose)
    id 'maven-publish'
    alias(libs.plugins.kover)
}

android {
    compileSdk = rootProject.emanateVersioning.compileSdk

    defaultConfig {
        minSdk = rootProject.emanateVersioning.minSdk
        targetSdk = rootProject.emanateVersioning.targetSdk

        testInstrumentationRunner = rootProject.emanateVersioning.testRunner

    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = rootProject.emanateVersioning.javaVersion
        targetCompatibility = rootProject.emanateVersioning.javaVersion
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(rootProject.emanateVersioning.kotlinJvmTarget)
        }
    }

    packaging {
        resources {
            pickFirsts += rootProject.emanateVersioning.resourceExclusions
        }
    }


    buildFeatures {
        compose = true
    }

    testOptions {
        unitTests {
            // Robolectric runs the Android code of the tests on the JVM with the module resources
            includeAndroidResources = true
            all {
                // Robolectric accesses JDK internals
                jvmArgs '--add-opens=java.base/java.io=ALL-UNNAMED', '--add-opens=java.base/java.lang=ALL-UNNAMED', '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED'
            }
        }
    }

    publishing {
        singleVariant("release")
    }

    namespace = rootProject.emanateVersioning.namespaceComposeNav2
}

dependencies {
    // The navigation module is the only one that depends on Navigation Compose: who uses another navigation does
    // not get it
    api project(path: ':emanate-compose-android')
    implementation project(path: ':emanate-android')

    api libs.androidx.navigation.compose


    testImplementation libs.junit
    testImplementation libs.kotlin.test.junit
    testImplementation libs.robolectric
    testImplementation libs.androidx.test.core
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.androidx.compose.ui.test.junit4
    testImplementation libs.androidx.compose.ui.test.manifest
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = rootProject.emanateVersioning.groupId
                artifactId = rootProject.emanateVersioning.artifactComposeNav2Id
                version = rootProject.emanateVersioning.versionName
            }
        }
    }
}
