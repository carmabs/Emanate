site_name: Emanate
site_description: A small library for MVI-style screens with Jetpack Compose, Kotlin Multiplatform ViewModels and Android Views
repo_url: https://github.com/carmabs/Ema
repo_name: carmabs/Ema

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy

markdown_extensions:
  - tables
  - toc:
      permalink: true
      # Anchors like the ones of GitHub, which keep the accents, so the links work in both places
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  # English pages are page.md and Spanish pages page.es.md
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: es
          name: Español
          # Not built until the Spanish pages are translated from the current English ones
          build: false
          site_description: Una pequeña librería para pantallas con un flujo MVI, con Jetpack Compose, ViewModels Kotlin Multiplatform y vistas de Android
          nav_translations:
            Home: Inicio
            Getting started: Primeros pasos
            Concepts: Conceptos
            Architecture: Arquitectura
            State: Estado
            Actions: Acciones
            Events: Eventos
            Source: Fuente
            Guides: Guías
            Configuration: Configuración
            Initializers: Inicializadores
            Results between screens: Resultados entre pantallas
            Async work and errors: Trabajo asíncrono y errores
            Dependency injection: Inyección de dependencias
            Permissions: Permisos
            Testing: Testing
            Kotlin Multiplatform: Kotlin Multiplatform
            Utilities: Utilidades
            Screens: Pantallas
            Navigation: Navegación
            Back handling: Botón atrás
            Dialogs: Diálogos
            Saving state: Guardar el estado
            Android Views: Vistas de Android
            Overview: Introducción
            Fragments and Activities: Fragments y Activities
            Navigation and back handling: Navegación y botón atrás
            Lists: Listas
            Recommendations: Recomendaciones
            Contributing: Contribuir

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Why Emanate: why-emanate.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - State: concepts/state.md
      - Actions: concepts/actions.md
      - Events: concepts/events.md
      - ViewModel: concepts/viewmodel.md
      - Source: concepts/source.md
  - Guides:
      - Mocking and environments: guides/environments.md
      - Testing: guides/testing.md
      - Saving state: guides/saving-state.md
      - Async work and errors: guides/async-and-errors.md
      - Results between screens: guides/results-between-screens.md
      - Initializers: guides/initializers.md
      - Dependency injection: guides/dependency-injection.md
      - Configuration: guides/configuration.md
      - Permissions: guides/permissions.md
      - Use cases and results: guides/use-cases.md
      - Kotlin Multiplatform: guides/multiplatform.md
  - Compose:
      - Screens: compose/screens.md
      - Navigation: compose/navigation.md
      - Back handling: compose/back-handling.md
      - Dialogs: compose/dialogs.md
      - Permissions: compose/permissions.md
  - Recommendations: recommendations.md
  - Contributing: contributing.md

# Version selector: every release is published with mike (see docs/contributing.md)
extra:
  version:
    provider: mike
    default: latest
