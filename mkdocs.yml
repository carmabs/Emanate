site_name: Emanate
site_description: A small library for MVI-style screens with Jetpack Compose, Kotlin Multiplatform ViewModels
repo_url: https://github.com/carmabs/Ema
repo_name: carmabs/Ema

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/moon-waning-crescent
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/white-balance-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
      # Anchors like the ones of GitHub, which keep the accents, so the links work in both places
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  # English pages are page.md and Spanish pages page.es.md
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: es
          name: Español
          build: true
          site_description: Una pequeña librería para pantallas con un flujo MVI, con Jetpack Compose, ViewModels Kotlin Multiplatform
          nav_translations:
            Home: Inicio
            Getting started: Primeros pasos
            Why Emanate: Por qué Emanate
            Concepts: Conceptos
            Architecture: Arquitectura
            State: Estado
            Actions: Acciones
            Events: Eventos
            Reducers: Reducers
            Side effects: Side effects
            Middlewares: Middlewares
            Broadcasts: Broadcasts
            Plugins: Plugins
            ViewModel: ViewModel
            EmaSource: EmaSource
            Utils: Utilidades
            Use cases: Casos de uso
            Results: Resultados
            Texts in the state: Textos en el estado
            Guides: Guías
            Configuration: Configuración
            Initializers: Inicializadores
            Surviving process death: Sobrevivir a la muerte del proceso
            Dependency injection and environments: Inyección de dependencias y entornos
            Testing: Testing
            Compose: Compose
            Screens: Pantallas
            Navigation: Navegación
            Back handling: Botón atrás
            Dialogs: Diálogos
            Permissions (Android): Permisos (Android)
            Recommendations: Recomendaciones
            Contributing: Contribuir

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Why Emanate: why-emanate.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - State: concepts/state.md
      - Actions: concepts/actions.md
      - Events: concepts/events.md
      - Reducers: concepts/reducers.md
      - Side effects: concepts/side-effects.md
      - Middlewares: concepts/middlewares.md
      - Broadcasts: concepts/broadcasts.md
      - Plugins: concepts/plugins.md
      - ViewModel: concepts/viewmodel.md
      - EmaSource: concepts/source.md
  - Utils:
      - Use cases: utils/use-cases.md
      - Results: utils/results.md
      - Texts in the state: utils/texts.md
  - Guides:
      - Configuration: guides/configuration.md
      - Initializers: guides/initializers.md
      - Surviving process death: guides/process-death.md
      - Dependency injection and environments: guides/dependency-injection.md
      - Testing: guides/testing.md
  - Compose:
      - Screens: compose/screens.md
      - Navigation: compose/navigation.md
      - Back handling: compose/back-handling.md
      - Dialogs: compose/dialogs.md
      - Permissions (Android): compose/permissions.md
  - Recommendations: recommendations.md
  - Contributing: contributing.md

# Version selector: every release is published with mike (see docs/contributing.md)
extra:
  version:
    provider: mike
    default: latest
