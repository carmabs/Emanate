 y="130" width="320" height="150" rx="14" fill="#FFFFFF" stroke="#C9CBF2" stroke-width="1.5"/><text x="518" y="156" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#3C40B3">handleLogin</text><text x="518" y="196" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#5d6f86">LoginSuccess</text><text x="518" y="214" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#22303f">→ navigate(Home)</text><text x="518" y="246" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#5d6f86">Message</text><text x="518" y="264" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#22303f">→ shows a message</text><rect x="500" y="310" width="320" height="150" rx="14" fill="#FFFFFF" stroke="#C9CBF2" stroke-width="1.5"/><text x="518" y="336" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#3C40B3">handleHome</text><text x="518" y="376" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#5d6f86">CloseClicked</text><text x="518" y="394" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#22303f">→ navigateBack()</text><path d="M362,251 L498,251" fill="none" stroke="#7a8aa0" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="440" y="243" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#5d6f86">event</text><path d="M362,431 L498,431" fill="none" stroke="#7a8aa0" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="440" y="423" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#5d6f86">event</text></svg>