<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500" role="img" aria-label="Each screen of the NavHost sends its events to the navigator, which decides where to go"><title>Each screen of the NavHost sends its events to the navigator, which decides where to go</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7a8aa0"/></marker></defs><rect x="0.75" y="0.75" width="858.5" height="498.5" rx="20" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1.5"/><rect x="20" y="20" width="380" height="460" rx="18" fill="#EEF4FB" stroke="#B4CCE4" stroke-width="1.5"/><text x="38" y="46" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#4b6a8a" letter-spacing="0.3">NavHost</text><text x="38" y="64" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#5d6f86">one destination per emaScreen</text><rect x="480" y="20" width="360" height="460" rx="18" fill="#EEF4FB" stroke="#B4CCE4" stroke-width="1.5"/><text x="498" y="46" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#4b6a8a" letter-spacing="0.3">MainNavigator</text><text x="498" y="64" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#5d6f86">your class, next to the NavHost</text><rect x="40" y="130" width="340" height="150" rx="14" fill="#FFFFFF" stroke="#B4CCE4" stroke-width="1.5"/><text x="58" y="156" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#22303