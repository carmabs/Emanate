<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-label="A broadcast reaches the ViewModels that listen to its type"><title>A broadcast reaches the ViewModels that listen to its type</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7a8aa0"/></marker></defs><rect x="0.75" y="0.75" width="858.5" height="328.5" rx="20" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1.5"/><rect x="20" y="20" width="250" height="290" rx="18" fill="#EEF4FB" stroke="#B4CCE4" stroke-width="1.5"/><text x="38" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#4b6a8a" letter-spacing="0.3">ProfileViewModel</text><rect x="103.0" y="113.0" width="84" height="84" rx="16" fill="#FFE5CF" stroke="#B3520F" stroke-opacity="0.18" stroke-width="1.5"/><g transform="translate(145,144.92)"><path d="M-21,0 H-5 M-5,0 L13,-14 M-5,0 H13 M-5,0 L13,14" fill="none" stroke="#B3520F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16" cy="-15" r="4" fill="#B3520F"/><circle cx="17" cy="0" r="4" fill="#B3520F"/><circle cx="16" cy="15" r="4" fill="#B3520F"/></g><text x="145" y="186.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#B3520F">Side effect</text><text x="145" y="215.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#7a8aa0">broadcast(FriendCreated)</text><path d="M190,155 L340,155" fill="none" stroke="#7a8aa0" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="346.0" y="111.0" width="88" height="88" rx="16" fill="#FFF0C2" stroke="#8A5F00" stroke-opacity="0.18" stroke-width="1.5"/><g transform