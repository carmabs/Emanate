<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="860" height="320" role="img" aria-label="What happens when an action arrives while its side effect is running"><title>What happens when an action arrives while its side effect is running</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7a8aa0"/></marker></defs><rect x="0.75" y="0.75" width="858.5" height="318.5" rx="20" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1.5"/><text x="250" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#7a8aa0" font-style="italic">action</text><text x="380" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#7a8aa0" font-style="italic">action again</text><rect x="20" y="36" width="820" height="76" rx="14" fill="#EEF4FB" stroke="#B4CCE4" stroke-width="1.5"/><text x="40" y="64" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#4b6a8a">Every</text><text x="40" y="84" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#7a8aa0">both run, in parallel</text><circle cx="250" cy="52" r="6" fill="#1D6A88"/><circle cx="380" cy="52" r="6" fill="#1D6A88"/><rect x="250" y="64" width="300" height="18" rx="9" fill="#FFE5CF" stroke="#B3520F" stroke-width="1.5"/><rect x="380" y="86" width="300" height="18" rx="9" fill="#FFE5CF" stroke="#B3520F" stroke-width="1.5"/><rect x="20" y="126" width="820" height="76" rx="14" fill="#EEF4FB" stroke="#B4CCE4" stroke-width="1.5"/><text x="40" y="154" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#4b6a8a">Latest</text><text x="40" y="174" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#7a8aa0">the new one cancels the running one</text><circle cx="250" cy="142" r="6" fill="#1D6A88"/><circle cx="380" cy="142" r="6" fill="#1D6A88"/><rect x="250" y="154" width="130" height="18" rx="9" fill="#EEF0F3" stroke="#9AA4B2" stroke-width="1.5" stroke-dasharray="4 3"/><text x="315.0" y="167" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#9AA4B2">cancelled</text><rect x="380" y="176" width="300" height="18" rx="9" fill="#FFE5CF" stroke="#B3520F" stroke-width="1.5"/><rect x="20" y="216" width="820" height="76" rx="14" fill="#EEF4FB" stroke="#B4CCE4" stroke-width="1.5"/><text x="40" y="244" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#4b6a8a">Leading</text><text x="40" y="264" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#7a8aa0">the new one is ignored while one runs</text><circle cx="250" cy="232" r="6" fill="#1D6A88"/><circle cx="380" cy="232" r="6" fill="#1D6A88"/><rect x="250" y="244" width="300" height="18" rx="9" fill="#FFE5CF" stroke="#B3520F" stroke-width="1.5"/><text x="394" y="280" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#9AA4B2">ignored</text><path d="M374,268 l12,12 M386,268 l-12,12" stroke="#9AA4B2" stroke-width="2.5" stroke-linecap="round"/><path d="M250,300 L760,300" fill="none" stroke="#7a8aa0" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="770" y="304" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#7a8aa0" font-style="italic">time</text></svg>