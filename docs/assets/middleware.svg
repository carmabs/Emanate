ound"/></g><text x="720" y="189.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2650C4">Reducers</text><path d="M320,210 L380,210 L380,260 L620,260" fill="none" stroke="#7a8aa0" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="500" y="252" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#232f3e">nextAfter { }</text><text x="500" y="278" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#7a8aa0">continues later: delay, debounce</text><rect x="685.0" y="225.0" width="70" height="70" rx="16" fill="#D9E6FF" stroke="#2650C4" stroke-opacity="0.18" stroke-width="1.5"/><g transform="translate(720,251.6)"><path d="M-20,-17 H20 L5,1 V17 H-5 V1 Z" fill="none" stroke="#2650C4" stroke-width="3" stroke-linejoin="round"/></g><text x="720" y="284.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2650C4">Reducers</text><path d="M320,210 L380,210 L380,355 L620,355" fill="none" stroke="#7a8aa0" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="500" y="347" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#232f3e">no next() / nextAfter() call</text><text x="500" y="373" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#7a8aa0">stops here</text><rect x="685.0" y="320.0" width="70" height="70" rx="16" fill="#EEF0F3" stroke="#9AA4B2" stroke-opacity="0.18" stroke-width="1.5"/><g transform="translate(720,346.6)"><path d="M-12,-12 L12,12 M12,-12 L-12,12" stroke="#9AA4B2" stroke-width="4" stroke-linecap="round"/></g><text x="720" y="379.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#9AA4B2">Stopped</text></svg>