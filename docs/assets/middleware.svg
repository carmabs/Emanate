<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" role="img" aria-label="A middleware decides the path of an action"><title>A middleware decides the path of an action</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7a8aa0"/></marker></defs><rect x="0.75" y="0.75" width="858.5" height="418.5" rx="20" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1.5"/><rect x="20" y="20" width="820" height="380" rx="18" fill="#EEF4FB" stroke="#B4CCE4" stroke-width="1.5"/><text x="38" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#4b6a8a" letter-spacing="0.3">Middleware</text><rect x="58.0" y="168.0" width="84" height="84" rx="16" fill="#D6EFFA" stroke="#1D6A88" stroke-opacity="0.18" stroke-width="1.5"/><g transform="translate(100,199.92)"><path d="M-9,-19 V13 L-1,6 L5,19 L10,17 L4,4 H14 Z" fill="none" stroke="#1D6A88" stroke-width="3" stroke-linejoin="round"/></g><text x="100" y="241.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1D6A88">Action</text><path d="M145,210 L215,210" fill="none" stroke="#7a8aa0" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="222.0" y="162.0" width="96" height="96" rx="16" fill="#FFDCEA" stroke="#B0245C" stroke-opacity="0.18" stroke-width="1.5"/><g transform="translate(270,198.48)"><path d="M0,-21 V-8 M0,8 V21" stroke="#B0245C" stroke-width="4" stroke-linecap="round"/><path d="M-21,0 H19" stroke="#B0245C" stroke-width="3" stroke-linecap="round"/><path d="M12,-7 L19,0 L12,7" fill="none" stroke="#B0245C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="270" y="247.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Se