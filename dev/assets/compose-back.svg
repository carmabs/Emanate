<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 260" width="990" height="260" role="img" aria-label="Flow of a back press that opens a confirmation dialog"><title>Flow of a back press that opens a confirmation dialog</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7a8aa0"/></marker></defs><rect x="0.75" y="0.75" width="988.5" height="258.5" rx="20" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1.5"/><rect x="30" y="50" width="210" height="130" rx="14" fill="#EEF4FB" stroke="#4b6a8a" stroke-opacity="0.3" stroke-width="1.5"/><text x="135.0" y="76" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#4b6a8a">1 · Back pressed</text><text x="135.0" y="94" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5d6f86" font-style="italic">arrow or system back</text><text x="135.0" y="126" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#22303f">User presses back</text><path d="M244,115 L266,115" fill="none" stroke="#7a8aa0" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="270" y="50" width="210" height="130" rx="14" fill="#E6DDFF" stroke="#5A3BD1" stroke-opacity="0.3" stroke-width="1.5"/><text x="375.0" y="76" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5A3BD1">2 · onBack</text><text x="375.0" y="94" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5d6f86" font-style="italic">screen content</text><text x="375.0" y="126" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#22303f">returns OnBack</text><text x="375.0" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5d6f86" font-style="italic">(no dialog open)</text><path d="M484,115 L506,115" fill="none" stroke="#7a8aa0" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="510" y="50" width="210" height="130" rx="14" fill="#FEE4E2" stroke="#B42318" stroke-opacity="0.3" stroke-width="1.5"/><text x="615.0" y="76" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#B42318">3 · ViewModel</text><text x="615.0" y="94" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5d6f86" font-style="italic">reducer</text><text x="615.0" y="126" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#22303f">state.copy(</text><text x="615.0" y="148" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#22303f">dialog = BackConfirmation)</text><path d="M724,115 L746,115" fill="none" stroke="#7a8aa0" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="750" y="50" width="210" height="130" rx="14" fill="#D0F2E9" stroke="#0B7563" stroke-opacity="0.3" stroke-width="1.5"/><text x="855.0" y="76" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B7563">4 · Navigator</text><text x="855.0" y="94" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5d6f86" font-style="italic">onEvent</text><text x="855.0" y="126" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#22303f">DialogConfirmationAccepted</text><text x="855.0" y="148" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#22303f">navigateBack()</text><text x="495.0" y="222" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6f86" font-style="italic">The confirmation dialog is drawn from the state. While it is open, onBack returns null and the dialog handles back.</text></svg>